[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexscan"
version = "2.0.0"
description = "Advanced multi-threaded port scanner with a dark terminal-inspired GUI"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"

authors = [
  { name = "Florian van den Bersselaar" },
  { name = "Hana Eun-Seo" },
  { name = "Simon Roberge" },
  { name = "Anna Zieleman" },
]

keywords = ["port-scanner", "network", "security", "nmap", "tkinter"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
  "Topic :: Security",
]

# tkinter ships with CPython — no pip package needed.
# List any additional runtime deps here if added later.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.10",
]

[project.scripts]
nexscan = "nexscan:main"

[project.urls]
Homepage = "https://github.com/Yeongwonhan-Jeolmang/NexScan"
"Bug Tracker" = "https://github.com/Yeongwonhan-Jeolmang/NexScan/issues"

# ── Setuptools package discovery ─────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "gui*", "reports*", "utils*"]

# ── Ruff ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — handled by Black
    "E702",  # multiple statements on one line (semicolons used intentionally in GUI code)
    "E731",  # lambda assignments — used intentionally for scan_fn dispatch
    "F841",  # local variable assigned but never used
    "W293",  # whitespace on blank line
]

# ── Black ─────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
exclude = "tests/test_nexscan\\.py"

# ── Mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = false
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
disable_error_code = ["no-any-return", "var-annotated", "call-arg", "misc", "str-unpack", "dict-item"]

# ── Pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"